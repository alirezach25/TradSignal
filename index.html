<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradSignal — فهرست صفحات</title>
<style>
:root{--bg:#f2f4f7;--p:#fff;--b:#dde3e9;--t:#17212b;--m:#5d6975;--a:#2b4acb;--abg:#e8ecfd;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1319;--p:#161d25;--b:#28333f;--t:#e5eaf0;--m:#92a0ad;--a:#8aa0ff;--abg:#1f2a4d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.7 Vazirmatn,Tahoma,system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:32px 16px 56px}
h1{margin:0;font-size:24px}.sub{color:var(--m);margin:4px 0 20px}
input{width:100%;font:inherit;color:var(--t);background:var(--p);border:1px solid var(--b);border-radius:10px;padding:10px 14px;margin-bottom:16px}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--t);background:var(--p);border:1px solid var(--b);border-radius:12px;padding:14px 16px}
.card:hover{border-color:var(--a)}
.card b{font-size:16px}.card small{color:var(--m)}
.card code{direction:ltr;unicode-bidi:embed;align-self:flex-start;background:var(--abg);color:var(--a);border-radius:6px;padding:0 8px;font-size:12px}
.empty{color:var(--m);padding:24px;text-align:center}
</style></head><body><div class="wrap">
<h1>TradSignal</h1>
<p class="sub">فهرست همه‌ی صفحه‌ها؛ روی هر کارت بزنید تا باز شود.</p>
<input id="q" type="search" placeholder="جستجو در صفحه‌ها..." aria-label="جستجو">
<div class="grid" id="grid"></div>
</div>
<script>
const OWNER='alirezach25',REPO='TradSignal',SELF='index.html';
// اگر لیست خودکار گیت‌هاب در دسترس نبود، این فهرست نمایش داده می‌شود
const FALLBACK=['SP2L.html','Signal.html','Signal02.html','liq8.html','liq9.html','signal1.html','trendzone.html'];
// توضیح دلخواه برای هر صفحه (اختیاری)
const NOTES={'liq9.html':'اسکنر نقدینگی با سیگنال تأییدشده','liq8.html':'اسکنر نقدینگی (نسخه‌ی قبلی)'};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let items=[];
function draw(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 const list=items.filter(i=>(i.name+' '+i.title+' '+i.note).toLowerCase().includes(q));
 document.getElementById('grid').innerHTML=list.length?list.map(i=>`<a class="card" href="${encodeURI(i.name)}"><b>${esc(i.title||i.name.replace(/\.html$/,''))}</b>${i.note?`<small>${esc(i.note)}</small>`:''}<code>${esc(i.name)}</code></a>`).join(''):'<div class="empty">صفحه‌ای پیدا نشد.</div>';
}
async function names(){
 try{
  const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/`);
  if(!r.ok)throw 0;
  const d=await r.json();
  const n=d.filter(x=>x.type==='file'&&/\.html?$/i.test(x.name)&&x.name.toLowerCase()!==SELF).map(x=>x.name);
  if(n.length)return n;
 }catch(e){}
 return FALLBACK;
}
(async()=>{
 const ns=(await names()).sort((a,b)=>a.localeCompare(b,'en',{sensitivity:'base'}));
 items=ns.map(name=>({name,title:'',note:NOTES[name]||''}));draw();
 // عنوان هر صفحه از تگ <title> خودش خوانده می‌شود
 await Promise.all(items.map(async i=>{try{const t=await (await fetch(i.name)).text(),m=t.match(/<title[^>]*>([^<]*)<\/title>/i);if(m&&m[1].trim())i.title=m[1].trim()}catch(e){}}));
 draw();
})();
document.getElementById('q').oninput=draw;
</script></body></html>
