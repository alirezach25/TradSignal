<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>اسکنر نقدینگی</title>
<style>
:root{--bg:#f2f4f7;--p:#fff;--p2:#f6f8fa;--b:#dde3e9;--t:#17212b;--m:#5d6975;--g:#0e8a5f;--gbg:#e1f5ec;--r:#cf3158;--rbg:#fce8ed;--y:#8a5d00;--ybg:#fff3cd;--a:#2b4acb;--abg:#e8ecfd;--on:#fff;--sh:0 1px 2px #1b283414;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1319;--p:#161d25;--p2:#1b242e;--b:#28333f;--t:#e5eaf0;--m:#92a0ad;--g:#3ecf94;--gbg:#12372a;--r:#ff7090;--rbg:#43212c;--y:#e3b341;--ybg:#3a2f12;--a:#8aa0ff;--abg:#1f2a4d;--on:#0e1319;--sh:none;color-scheme:dark}}

body{margin:0;background:var(--bg);color:var(--t);font:14px/1.65 Vazirmatn,Tahoma,system-ui,sans-serif}

button{cursor:pointer}button:hover{border-color:var(--a)}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
button.pri{background:var(--a);border-color:var(--a);color:var(--on);font-weight:700}
button.dgr{border-color:var(--r);color:var(--r);font-weight:700}
button.ico{padding:6px 10px}
header{position:sticky;top:0;z-index:6;background:var(--p);border-bottom:1px solid var(--b);padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hl{display:flex;gap:12px;align-items:center;min-width:0}h1{font-size:17px;margin:0;white-space:nowrap}
.pill{background:var(--p2);border:1px solid var(--b);border-radius:99px;padding:2px 12px;color:var(--m);font-size:12px;max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr{display:flex;gap:8px;align-items:center}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
.panel{background:var(--p);border-bottom:1px solid var(--b);padding:14px 0}
.panel .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
fieldset{border:1px solid var(--b);border-radius:10px;margin:0;padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-weight:700;padding:0 6px}

.hint{color:var(--m);font-size:12px;margin:0}

details.more{margin-top:8px}summary{cursor:pointer;color:var(--a);font-weight:600;width:fit-content}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-top:10px}

:root{--dirtxt:#fff}@media (prefers-color-scheme:dark){.dir{color:#0e1319}}
.tf{background:var(--p2);border:1px solid var(--b);padding:0 8px;border-radius:6px;font-size:12px}

.card.wait .ring b{background:var(--ybg)}
.cs{font-weight:600;line-height:1.5}.cs.ok{color:var(--g)}.cs.wt{color:var(--y)}.cs.mu{color:var(--m);font-weight:400}

#mod{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}#mod[hidden]{display:none}
#card{background:var(--p);border-radius:14px;max-width:700px;width:100%;max-height:92vh;overflow:auto;padding:18px;box-shadow:0 10px 40px #0005}

#card h3{margin:16px 0 6px;font-size:14px;color:var(--a)}
.banner{border-radius:10px;padding:12px 14px;color:#fff;margin-bottom:12px}.banner b{font-size:20px;display:block}.banner.sell{background:var(--r)}.banner.buy{background:var(--g)}.banner span{font-size:13px;opacity:.95}
@media (prefers-color-scheme:dark){.banner{color:#0e1319}}
.bds{display:flex;gap:6px;flex-wrap:wrap}

@media (max-width:560px){.kv{grid-template-columns:repeat(2,1fr)}.list{grid-template-columns:1fr}.pill{max-width:100%}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style></head><body>
<header>
 <div class="hl"><h1>🎯 اسکنر نقدینگی</h1><span id="st" class="pill">آماده</span></div>
 <div class="hr"><button id="go" class="pri">▶ شروع اسکن و فعال‌سازی صدا</button><button id="stop" class="dgr" hidden>⏹ توقف</button><button id="mute" class="ico" title="روشن/خاموش کردن صدا">🔊</button><button id="cfg" class="ico" title="تنظیمات" aria-expanded="false">⚙ تنظیمات</button></div>
</header>
<section class="panel" id="panel" hidden><div class="wrap">
 <fieldset><legend>اسکن بازار</legend>
  <label>تعداد ارزها (بر اساس حجم)<select id="top"><option value="20">۲۰ ارز برتر</option><option value="50">۵۰ ارز برتر</option><option value="100">۱۰۰ ارز برتر</option><option value="200">۲۰۰ ارز برتر</option><option value="0">همه ارزها (کند)</option></select></label>
  <label>حداقل حجم ۲۴ساعته (میلیون دلار)<input id="minVol" type="number" min="0" step="5"></label>
  <label>بروزرسانی قیمت (ثانیه)<input id="every" type="number" min="2" max="60"></label>
 </fieldset>
 <fieldset><legend>شرط سیگنال: لمس نقدینگی + کندل‌های معکوس</legend>
  <label>تایم‌فریم بررسی برگشت<select id="ltf"><option value="5m">۵ دقیقه</option><option value="15m">۱۵ دقیقه</option><option value="30m">۳۰ دقیقه</option></select></label>
  <label>حداقل کندل معکوس پشت‌سرهم<select id="revN"><option value="2">۲ کندل</option><option value="3">۳ کندل</option></select></label>
  <label>لمس نقدینگی تا چند کندل قبل معتبر است<select id="lookback"><option value="8">۸ کندل</option><option value="16">۱۶ کندل</option><option value="32">۳۲ کندل</option><option value="48">۴۸ کندل</option></select></label>
  <label class="in"><input type="checkbox" id="touchFull">لمس دقیق سطح نقدینگی (نه فقط ورود به ناحیه)</label>
  <label>حداکثر فاصله از نقطه لمس (ATR) — بعد از آن «دیر شده» است<input id="chase" type="number" min="1" max="10" step="0.5"></label>
  <label>حداقل R:R تا هدف اول<input id="minRR" type="number" min="0.5" max="5" step="0.1"></label>
 </fieldset>
 <fieldset><legend>آلارم</legend>
  <label class="in"><input type="checkbox" id="preAlert">هشدار قبل از لمس هم بده (نزدیک شدن به نقدینگی)</label>
  <label>فاصله پایش: <span id="nearV">1</span> ATR<input id="near" type="range" min="0.2" max="3" step="0.1"></label>
  <label>حداکثر فاصله تا نقدینگی: <span id="nearPctV">2</span>٪<input id="nearPct" type="range" min="0.3" max="10" step="0.1"></label>
  <label>حداقل امتیاز برای آلارم: <span id="minScV">40</span><input id="minScore" type="range" min="0" max="90" step="5"></label>
  <label>بلندی صدا: <span id="volV">40</span>٪<input id="vol" type="range" min="0" max="100" step="5"></label>
  <label>نوع صدا<select id="tone"><option value="siren">آژیر (بلند)</option><option value="beep">بوق</option><option value="bell">زنگ</option></select></label>
  <label>تعداد تکرار<select id="rep"><option>1</option><option>3</option><option>5</option><option>10</option></select></label>
  <button id="test">🔔 تست صدا</button>
 </fieldset>
</div></section>
<div class="wrap"><nav class="tabs" role="tablist">
 <button class="tab" role="tab" data-tab="sig">✅ سیگنال تأییدشده<i id="nSig">0</i></button>
 <button class="tab" role="tab" data-tab="watch">👁 پایش نقدینگی<i id="nWatch">0</i></button>
</nav></div>
<section class="filters"><div class="wrap">
 <div class="frow"><b>تایم‌فریم نقدینگی</b><span class="chips" id="tfs"></span></div>
 <details class="more"><summary>فیلترهای بیشتر</summary>
  <div class="mg">
   <fieldset><legend>واگرایی</legend><div class="grp"><label class="ck" title="واگرایی منفی روی سقف‌ها (شورت) و مثبت روی کف‌ها (لانگ)؛ RSI فقط در اشباع (بالای ۶۵ / زیر ۳۵) ستاره می‌گیرد"><input type="checkbox" id="dRsi">RSI</label><label class="ck" title="MACD با تنظیمات ۱۲، ۲۶، ۹"><input type="checkbox" id="dMacd">MACD</label><label class="ck" title="واگرایی RSI فقط وقتی معتبر باشد که RSI در اشباع باشد"><input type="checkbox" id="rsiZone">RSI حتماً در اشباع</label></div><select id="dMode" title="وقتی هر دو واگرایی روشن‌اند"><option value="all">هر دو واگرایی لازم</option><option value="any">یکی از دو واگرایی کافی</option></select></fieldset>
   <fieldset><legend>والیوم پروفایل</legend><label class="ck" title="سطح نقدینگی باید خارج از محدوده ارزش (بالای VAH برای شورت / زیر VAL برای لانگ) یا روی گره حجمی POC/HVN باشد"><input type="checkbox" id="vp">سطح نقدینگی روی ساختار حجمی باشد</label></fieldset>
   <fieldset><legend>قدرت نقدینگی</legend><span id="fl" class="grp"></span></fieldset>
   <fieldset><legend>قدرت سیگنال</legend><span id="fs" class="grp"></span></fieldset>
   <fieldset><legend>تب پایش</legend><div class="grp"><label class="ck" title="فقط ارزهایی که تا چند کندل کوچک به نقدینگی مانده‌اند"><input type="checkbox" id="sniper">دقیق: فاصله ≤ <input id="snipN" type="number" min="0.5" max="5" step="0.5" style="width:56px;padding:2px 4px"> کندل</label><label class="ck"><input type="checkbox" id="onlyNear">فقط نزدیک به نقدینگی</label></div><select id="sort"><option value="s">مرتب‌سازی: امتیاز</option><option value="d">مرتب‌سازی: نزدیک‌ترین</option></select></fieldset>
  </div>
 </details>
</div></section>
<main class="wrap list" id="list"><div class="empty">برای شروع دکمه «شروع اسکن» را بزنید.</div></main>
<div id="mod" hidden><div id="card" role="dialog" aria-modal="true"><div id="mb"></div><div class="mbtn"><button id="img" class="pri">📷 ذخیره تصویر</button><button id="x">بستن</button></div></div></div>
<script>
const DIV={maxGap:80,minGap:4,ob:65,os:35,bonus:10,zoneBonus:5,maxTry:4};
const TFS=['1h','2h','4h','12h','1d','3d','4d','1w'],W={'1h':5,'2h':6,'4h':8,'12h':10,'1d':12,'3d':13,'4d':14,'1w':15};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const DEF={tfs:['2h','4h','1d','1w'],top:50,minVol:20,near:1,minScore:40,vol:40,tone:'siren',rep:3,every:5,sound:true,onlyNear:true,nearPct:2,sniper:false,snipN:1,sort:'s',fl:[0,1,2],fs:[0,1,2,3],dRsi:false,dMacd:false,rsiZone:false,dMode:'all',vp:false,ltf:'15m',revN:2,lookback:16,touchFull:true,chase:3.5,minRR:1.5,preAlert:false,tab:'sig'};
const S=Object.assign({},DEF,(()=>{try{return JSON.parse(localStorage.lq)}catch(e){return{}}})());
const save=()=>{try{localStorage.lq=JSON.stringify(S)}catch(e){}};
if(S.v!==4){S.v=4;S.tab='sig';save()}
S.tfs=(S.tfs||[]).filter(t=>TFS.includes(t));if(!S.tfs.length)S.tfs=DEF.tfs.slice();
if(!['5m','15m','30m'].includes(S.ltf))S.ltf='15m';
const BASE='https://fapi.binance.com/fapi/v1/',STABLE=/^(USDC|FDUSD|TUSD|BUSD|USDP|DAI|AEUR|EUR|USD1|RLUSD|XUSD|UST)USDT$/;
const LTF_STALE=6e5,SIG_TTL=3600e3,GHOST_MS=6*3600e3;
let stopReq=false,price={},fund={},volMap={},results=[],alerted={},scanning=false,open=null,ac,started=false,skew=0;
const f=n=>{n=+n;if(!isFinite(n))return'—';let s=String(+n.toPrecision(6));if(/e/i.test(s))s=n.toFixed(12).replace(/0+$/,'');return s},pad=ms=>new Promise(r=>setTimeout(r,ms));
const nowS=()=>Date.now()+skew;
const status=t=>$('#st').textContent=t;
const rkey=r=>r.sym+'|'+r.tf+'|'+(r.up?'U':'D')+'|'+r.lvl;

const requests=new Set();
let nextAt=0,pauseUntil=0,errs=0,consec=0,banMsg='';
async function gate(weight,signal){
 while(!signal.aborted&&!stopReq){
  const now=Date.now(),wait=Math.max(nextAt,pauseUntil)-now;
  if(wait<=0){nextAt=Math.max(now-1500,nextAt)+weight*30;return true}
  await new Promise(resolve=>{
   const done=()=>{clearTimeout(timer);signal.removeEventListener('abort',done);resolve()};
   const timer=setTimeout(done,wait);signal.addEventListener('abort',done,{once:true});
  });
 }
 return false;
}
async function j(u,weight){
 const ab=new AbortController();requests.add(ab);
 try{
  for(let i=0;i<3;i++){
   if(!await gate(weight,ab.signal)||ab.signal.aborted||stopReq)return null;
   const attempt=new AbortController(),cancel=()=>attempt.abort();
   ab.signal.addEventListener('abort',cancel,{once:true});
   const timeout=setTimeout(cancel,8000);
   try{
    const r=await fetch(BASE+u,{signal:attempt.signal});
    if(r.status===418||r.status===429){
     const header=r.headers.get('retry-after'),seconds=Number(header);
     const delay=header&&Number.isFinite(seconds)?seconds*1000:Date.parse(header)-Date.now();
     const ms=delay>0?delay:(r.status===418?300000:10000);
     pauseUntil=Math.max(pauseUntil,Date.now()+ms);
     if(r.status===418||ms>90000){
      banMsg='⛔ محدودیت بایننس؛ حدود '+Math.ceil(ms/60000)+' دقیقه صبر کنید';
      stopReq=true;requests.forEach(request=>request.abort());return null;
     }
     status('⚠ محدودیت نرخ بایننس؛ '+Math.ceil(ms/1000)+' ثانیه مکث');continue;
    }
    if(r.status===403||r.status===451){
     banMsg='⚠ دسترسی به API بایننس مسدود است (HTTP '+r.status+')';
     stopReq=true;requests.forEach(request=>request.abort());return null;
    }
    if(r.status>=400&&r.status<500){errs++;return null}
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();consec=0;return data;
   }catch(e){
    if(ab.signal.aborted)return null;
    errs++;
    if(++consec>=30){
     banMsg='⚠ اتصال به بایننس ناپایدار است؛ دوباره شروع کنید';
     stopReq=true;requests.forEach(request=>request.abort());return null;
    }
    if(i<2)await pad(300*(i+1));
   }finally{clearTimeout(timeout);ab.signal.removeEventListener('abort',cancel)}
  }
  return null;
 }finally{requests.delete(ab)}
}
const history=new Map(),day=86400000,UNIT={m:60000,h:3600000,d:day,w:7*day},stepOf=tf=>parseInt(tf)*UNIT[tf.slice(-1)];
async function candles(sym,tf,limit){
 const key=sym+'|'+tf,prev=history.get(key),step=stepOf(tf);
 const last=prev?.bars.at(-1);
 const delta=last&&prev.limit>=limit&&Date.now()-last.t<98*step;
 const count=delta?Math.min(99,Math.max(2,Math.floor((Date.now()-last.t)/step)+2)):limit;
 const d=await j('klines?symbol='+sym+'&interval='+tf+'&limit='+count,count<100?1:2);
 if(!Array.isArray(d)||!d.length)return null;
 const latest=d.map(k=>({t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[7],end:+k[6]}));
 const bars=(delta?prev.bars.filter(k=>k.t<latest[0].t).concat(latest):latest).slice(-limit);
 history.set(key,{bars,limit});return bars;
}
// ===== اندیکاتورها: RSI (وایلدر ۱۴) و MACD (۱۲،۲۶،۹) =====
const rv=(g,l)=>l===0?(g===0?50:100):100-100/(1+g/l);
function calcRSI(c,n=14){
 const v=Array(c.length).fill(NaN),ag=v.slice(),al=v.slice();
 if(c.length<=n)return{v,ag,al};
 let g=0,l=0;
 for(let i=1;i<=n;i++){const d=c[i].c-c[i-1].c;if(d>=0)g+=d;else l-=d}
 g/=n;l/=n;v[n]=rv(g,l);ag[n]=g;al[n]=l;
 for(let i=n+1;i<c.length;i++){const d=c[i].c-c[i-1].c;g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;v[i]=rv(g,l);ag[i]=g;al[i]=l}
 return{v,ag,al}}

 for(let i=0;i<S.rep*2;i++){const o=ac.createOscillator();o.type=T[0];o.frequency.value=T[1][i%2];o.connect(g);o.start(t);o.stop(t+.26);t+=.3}}
function fire(r,confirmed){beep();const nm=r.sym.replace('USDT',''),side=r.up?'سقف':'کف',
 m=confirmed?`سیگنال ${r.up?'شورت':'لانگ'} ${nm} ${r.tf} — ${r.sig.m} کندل ${S.ltf} معکوس بعد از لمس نقدینگی ${side} (${f(r.lvl)}) | ورود ${f(r.sig.entry)} | استاپ ${f(r.sig.sl)}`
  :`${nm} ${r.tf} — نزدیک نقدینگی ${side} (${f(r.lvl)})`;
 const tags=`${S.dRsi&&r.dR?' | واگرایی RSI':''}${S.dMacd&&r.dM?' | واگرایی MACD':''}${S.vp&&r.vp&&(r.vp.prem||r.vp.node)?' | والیوم پروفایل':''}`;
 document.title=(confirmed?'✅ ':'🔔 ')+m;setTimeout(()=>document.title='اسکنر نقدینگی',15000);
 try{if(Notification.permission==='granted')new Notification(confirmed?'سیگنال نقدینگی':'آلارم نقدینگی',{body:m+tags})}catch(e){}}

// ===== رابط =====
$('#fl').innerHTML=LL.map((l,i)=>`<label class="ck"><input type="checkbox" value="${i}">${l}</label>`).join('');
$('#fs').innerHTML=['ضعیف','متوسط','قوی','خیلی قوی'].map((l,i)=>`<label class="ck"><input type="checkbox" value="${i}">${l}</label>`).join('');
const TFN={'1w':'۱ هفته','1d':'۱ روز','3d':'۳ روز','4d':'۴ روز'};
$('#tfs').innerHTML=TFS.map(t=>`<span class="chip" role="button" tabindex="0" data-t="${t}">${TFN[t]||t}</span>`).join('');
const NUM=['top','minVol','near','nearPct','minScore','vol','every','revN','lookback','chase','minRR','snipN'],SEL=['tone','rep','sort','dMode','ltf'],CHK=['dRsi','dMacd','rsiZone','vp','sniper','onlyNear','touchFull','preAlert'];
const syncUI=()=>{
 $$('#tfs .chip').forEach(c=>c.classList.toggle('on',S.tfs.includes(c.dataset.t)));
 [...NUM,...SEL].forEach(k=>$('#'+k).value=S[k]);CHK.forEach(k=>$('#'+k).checked=!!S[k]);
 $('#nearV').textContent=S.near;$('#nearPctV').textContent=S.nearPct;$('#minScV').textContent=S.minScore;$('#volV').textContent=S.vol;
 $('#mute').textContent=S.sound?'🔊':'🔇';
 $$('#fl input').forEach(i=>i.checked=S.fl.includes(+i.value));$$('#fs input').forEach(i=>i.checked=S.fs.includes(+i.value))};
let dt;const rescan=()=>{clearTimeout(dt);dt=setTimeout(scan,800)};
const toggleTf=e=>{const t=e.target.dataset&&e.target.dataset.t;if(!t)return;S.tfs=S.tfs.includes(t)?S.tfs.filter(x=>x!==t):[...S.tfs,t];if(!S.tfs.length)S.tfs=[t];save();syncUI();rescan()};
$('#tfs').onclick=toggleTf;$('#tfs').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleTf(e)}};
['top','minVol'].forEach(k=>$('#'+k).onchange=e=>{S[k]=+e.target.value;save();rescan()});
['near','nearPct','minScore','vol','every'].forEach(k=>$('#'+k).oninput=e=>{S[k]=+e.target.value;save();syncUI();if(k==='every')setupTimer()});
['revN','lookback','chase','minRR','snipN'].forEach(k=>$('#'+k).onchange=e=>{S[k]=+e.target.value||DEF[k];save();syncUI();tick(true)});
['tone','rep','sort','dMode'].forEach(k=>$('#'+k).onchange=e=>{S[k]=k==='rep'?+e.target.value:e.target.value;save();tick(true)});
$('#ltf').onchange=e=>{S.ltf=e.target.value;save();for(const k of Object.keys(ltf))delete ltf[k];sigs.clear();tick(true);ltfRefresh().then(()=>tick(true))};
CHK.forEach(k=>$('#'+k).onchange=e=>{S[k]=e.target.checked;save();tick(true)});
$('#fl').onchange=e=>{S.fl=$$('#fl input:checked').map(i=>+i.value);save();tick(true)};
$('#fs').onchange=e=>{S.fs=$$('#fs input:checked').map(i=>+i.value);save();tick(true)};
$$('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;save();tick(true)});
$('#x').onclick=closeModal;$('#mod').onclick=e=>{if(e.target.id==='mod')closeModal()};$('#img').onclick=saveImg;document.onkeydown=e=>{if(e.key==='Escape')closeModal()};
$('#mute').onclick=()=>{S.sound=!S.sound;save();syncUI()};
$('#cfg').onclick=()=>{const p=$('#panel');p.hidden=!p.hidden;$('#cfg').setAttribute('aria-expanded',!p.hidden)};
$('#test').onclick=()=>{const s=S.sound;S.sound=true;beep();S.sound=s};
const openCard=e=>{const c=e.target.closest&&e.target.closest('.card');if(!c)return;open=c.dataset.id;tick(true)};
$('#list').onclick=openCard;$('#list').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openCard(e)}};
let pt;const setupTimer=()=>{clearInterval(pt);pt=setInterval(()=>started&&tick(),Math.max(2,S.every)*1000)};
const go2=()=>{if(!started)return;if(scanning){setTimeout(go2,100);return}stopReq=false;scan();setupTimer();tick()};
$('#stop').onclick=()=>{started=false;stopReq=true;scanQueued=false;requests.forEach(request=>request.abort());clearInterval(pt);$('#stop').hidden=true;$('#go').textContent='▶ شروع مجدد';status('⏹ متوقف شد (اسکن، قیمت زنده و آلارم خاموش‌اند)')};
$('#go').onclick=()=>{started=true;$('#stop').hidden=false;try{Notification.requestPermission()}catch(e){}const Ctx=window.AudioContext||window.webkitAudioContext;if(Ctx){ac=ac||new Ctx();ac.resume().catch(()=>{})}$('#go').textContent='⟳ اسکن مجدد';go2()};
setInterval(()=>started&&!scanning&&scan(),3*60*1000);
syncUI();render([]);
</script>
