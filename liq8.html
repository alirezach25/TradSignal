<style>

</style></head><body>
<header><h1>🎯 اسکنر نقدینگی</h1><span id="st">آماده</span>
<button id="go" class="pri">▶ شروع اسکن + فعال‌سازی صدا</button><button id="stop" style="border-color:var(--r);color:var(--r);font-weight:700" hidden>⏹ توقف</button><button id="mute">🔊</button><button id="cfg">⚙ تنظیمات</button></header>
<div class="panel" id="panel" hidden>
<label>تعداد ارزها (بر اساس حجم)<select id="top"><option value="20">۲۰ ارز برتر</option><option value="50">۵۰ ارز برتر</option><option value="100">۱۰۰ ارز برتر</option><option value="200">۲۰۰ ارز برتر</option><option value="0">همه ارزها (کند)</option></select></label>

<label>حداقل امتیاز برای آلارم: <span id="minScV"></span><input id="minScore" type="range" min="0" max="90" step="5"></label>

<label class="ck" title="واگرایی منفی روی سقف‌ها (شورت) و مثبت روی کف‌ها (لانگ)؛ RSI فقط در اشباع (بالای ۶۵ / زیر ۳۵)"><input type="checkbox" id="dRsi"> واگرایی RSI</label><label class="ck" title="MACD با تنظیمات ۱۲،۲۶،۹"><input type="checkbox" id="dMacd"> واگرایی MACD</label><label class="ck" title="واگرایی RSI فقط وقتی معتبر باشد که RSI بالای ۶۵ (سقف) یا زیر ۳۵ (کف) باشد؛ در غیر این صورت هم نشان داده می‌شود ولی ستاره (★) و امتیاز اضافه ندارد"><input type="checkbox" id="rsiZone"> RSI حتماً در اشباع</label><select id="dMode" title="وقتی هر دو واگرایی روشن‌اند"><option value="all">هر دو واگرایی لازم</option><option value="any">یکی از دو واگرایی کافی</option></select><label class="ck" title="والیوم پروفایل ۲۰۰ کندل: سطح نقدینگی باید خارج از محدوده ارزش (بالای VAH برای شورت / زیر VAL برای لانگ) یا روی گره حجمی POC/HVN باشد"><input type="checkbox" id="vp"> والیوم پروفایل</label>

<div id="mod" hidden><div id="card"><div id="mb"></div><div class="mbtn"><button id="img" class="pri">📷 ذخیره تصویر</button><button id="x">بستن</button></div></div></div>
<script>
const DIV={maxGap:80,minGap:4,ob:65,os:35,bonus:10,zoneBonus:5,maxTry:4};
const TFS=['1h','2h','4h','12h','1d','3d','4d','1w'],W={'1h':5,'2h':6,'4h':8,'12h':10,'1d':12,'3d':13,'4d':14,'1w':15};
const $=s=>document.querySelector(s);
const S=Object.assign({tfs:['4h','1w'],top:50,minVol:20,near:1,minScore:40,vol:80,tone:'siren',rep:3,every:5,sound:true,onlyNear:true,nearPct:2,sniper:false,snipN:1,sort:'s',fl:[0,1,2],fs:[0,1,2,3],dRsi:false,dMacd:false,rsiZone:false,dMode:'all',vp:false},(()=>{try{return JSON.parse(localStorage.lq)}catch(e){return{}}})());
const save=()=>{try{localStorage.lq=JSON.stringify(S)}catch(e){}};
if(S.v!==3){S.onlyNear=true;S.nearPct=S.nearPct||2;S.sniper=true;S.snipN=S.snipN||1;S.v=3;save()}
const BASE='https://fapi.binance.com/fapi/v1/';
let stopReq=false,c15={},price={},fund={},volMap={},results=[],alerted={},scanning=false,open=null,ac,started=false;
const f=n=>+(+n).toPrecision(6),pad=ms=>new Promise(r=>setTimeout(r,ms));
const status=t=>$('#st').textContent=t;

const requests=new Set();
let nextAt=0,pauseUntil=0,errs=0,consec=0,banMsg='';
async function gate(weight,signal){
 while(!signal.aborted&&!stopReq){
  const now=Date.now(),wait=Math.max(nextAt,pauseUntil)-now;
  if(wait<=0){nextAt=Math.max(now-1500,nextAt)+weight*30;return true}
  await new Promise(resolve=>{
   const done=()=>{clearTimeout(timer);signal.removeEventListener('abort',done);resolve()};
   const timer=setTimeout(done,wait);signal.addEventListener('abort',done,{once:true});
  });
 }
 return false;
}
async function j(u,weight){
 const ab=new AbortController();requests.add(ab);
 try{
  for(let i=0;i<3;i++){
   if(!await gate(weight,ab.signal)||ab.signal.aborted||stopReq)return null;
   const attempt=new AbortController(),cancel=()=>attempt.abort();
   ab.signal.addEventListener('abort',cancel,{once:true});
   const timeout=setTimeout(cancel,8000);
   try{
    const r=await fetch(BASE+u,{signal:attempt.signal});
    if(r.status===418||r.status===429){
     const header=r.headers.get('retry-after'),seconds=Number(header);
     const delay=header&&Number.isFinite(seconds)?seconds*1000:Date.parse(header)-Date.now();
     const ms=delay>0?delay:(r.status===418?300000:10000);
     pauseUntil=Math.max(pauseUntil,Date.now()+ms);
     if(r.status===418||ms>90000){
      banMsg='⛔ محدودیت بایننس؛ حدود '+Math.ceil(ms/60000)+' دقیقه صبر کنید';
      stopReq=true;requests.forEach(request=>request.abort());return null;
     }
     status('⚠ محدودیت نرخ بایننس؛ '+Math.ceil(ms/1000)+' ثانیه مکث');continue;
    }
    if(r.status===403||r.status===451){
     banMsg='⚠ دسترسی به API بایننس مسدود است (HTTP '+r.status+')';
     stopReq=true;requests.forEach(request=>request.abort());return null;
    }
    if(r.status>=400&&r.status<500){errs++;return null}
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();consec=0;return data;
   }catch(e){
    if(ab.signal.aborted)return null;
    errs++;
    if(++consec>=30){
     banMsg='⚠ اتصال به بایننس ناپایدار است؛ دوباره شروع کنید';
     stopReq=true;requests.forEach(request=>request.abort());return null;
    }
    if(i<2)await pad(300*(i+1));
   }finally{clearTimeout(timeout);ab.signal.removeEventListener('abort',cancel)}
  }
  return null;
 }finally{requests.delete(ab)}
}
const history=new Map(),day=86400000;
async function candles(sym,tf,limit){
 const key=sym+'|'+tf,prev=history.get(key);
 const step=tf==='1w'?7*day:tf==='15m'?900000:parseInt(tf)*(tf.endsWith('d')?day:3600000);
 const last=prev?.bars.at(-1);
 const delta=last&&prev.limit>=limit&&Date.now()-last.t<98*step;
 const count=delta?Math.min(99,Math.max(2,Math.floor((Date.now()-last.t)/step)+2)):limit;
 const d=await j('klines?symbol='+sym+'&interval='+tf+'&limit='+count,count<100?1:2);
 if(!Array.isArray(d)||!d.length)return null;
 const latest=d.map(k=>({t:+k[0],h:+k[2],l:+k[3],c:+k[4],v:+k[7],end:+k[6]}));
 const bars=(delta?prev.bars.filter(k=>k.t<latest[0].t).concat(latest):latest).slice(-limit);
 history.set(key,{bars,limit});return bars;
}
// ===== اندیکاتورها: RSI (وایلدر ۱۴) و MACD (۱۲،۲۶،۹) =====
const rv=(g,l)=>l===0?(g===0?50:100):100-100/(1+g/l);
function calcRSI(c,n=14){
 const v=Array(c.length).fill(NaN),ag=v.slice(),al=v.slice();
 if(c.length<=n)return{v,ag,al};
 let g=0,l=0;
 for(let i=1;i<=n;i++){const d=c[i].c-c[i-1].c;if(d>=0)g+=d;else l-=d}
 g/=n;l/=n;v[n]=rv(g,l);ag[n]=g;al[n]=l;
 for(let i=n+1;i<c.length;i++){const d=c[i].c-c[i-1].c;g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;v[i]=rv(g,l);ag[i]=g;al[i]=l}
 return{v,ag,al}}
const rsiLive=(s,px)=>{const d=px-s.pc;return rv((s.g*13+Math.max(d,0))/14,(s.l*13+Math.max(-d,0))/14)};
function calcMACD(c,f=12,s=26,g=9){
 const kf=2/(f+1),ks=2/(s+1),kg=2/(g+1),m=Array(c.length),h=Array(c.length);let ef=c[0].c,es=c[0].c,sg=0;
 for(let i=0;i<c.length;i++){ef+=(c[i].c-ef)*kf;es+=(c[i].c-es)*ks;m[i]=ef-es;sg=i?sg+(m[i]-sg)*kg:m[i];h[i]=m[i]-sg}
 return{m,h}}
function aggregate4d(bars){
 const groups=new Map(),step=4*day;
 for(const bar of bars){
  const t=Math.floor(bar.t/step)*step,g=groups.get(t);
  if(g){g.h=Math.max(g.h,bar.h);g.l=Math.min(g.l,bar.l);g.c=bar.c;g.v+=bar.v;g.count++}
  else groups.set(t,{...bar,t,end:t+step-1,count:1});
 }
 return [...groups.values()].filter(g=>g.count===4);
}
const atr=(c,n=14)=>{let s=0;for(let i=c.length-n;i<c.length;i++){const p=c[i-1];s+=Math.max(c[i].h-c[i].l,Math.abs(c[i].h-p.c),Math.abs(c[i].l-p.c))}return s/n};

function analyze(sym,tf,c){
 const n=c.length,A=atr(c),px=c[n-1].c,L=['1w','4d','3d'].includes(tf)?2:3;
 if(!(A>0&&px>0))return [];
 const ph=[],pl=[],sH=Array(n).fill(-Infinity),sL=Array(n).fill(Infinity);
 for(let i=n-2;i>=0;i--){sH[i]=Math.max(sH[i+1],c[i+1].h);sL[i]=Math.min(sL[i+1],c[i+1].l)}
 for(let i=L;i<n-L;i++){let H=1,Lw=1;for(let k=1;k<=L;k++){if(!(c[i].h>=c[i-k].h&&c[i].h>c[i+k].h))H=0;if(!(c[i].l<=c[i-k].l&&c[i].l<c[i+k].l))Lw=0}
  if(H)ph.push({i,p:c[i].h});if(Lw)pl.push({i,p:c[i].l})}
 const av=a=>a.reduce((s,x)=>s+x.v,0)/a.length,volRatio=av(c.slice(-3))/(av(c.slice(-23,-3))||1);
 const tol=Math.min(.25*A,.005*px),out=[];
 // ===== واگرایی RSI / MACD در سقف‌ها و کف‌ها =====
 // ===== والیوم پروفایل (آخرین ۲۰۰ کندل): POC، محدوده ارزش ۷۰٪ (VAH/VAL)، گره‌های پرحجم (HVN) =====
 function volProfile(){
  const w=c.slice(-Math.min(n,200)),lo=Math.min(...w.map(x=>x.l)),hi=Math.max(...w.map(x=>x.h)),N=60,bs=(hi-lo)/N;
  if(!(bs>0))return null;
  const v=Array(N).fill(0);
  for(const x of w){
   const a=Math.min(N-1,Math.floor((x.l-lo)/bs)),b=Math.min(N-1,Math.floor((x.h-lo)/bs)),m=b-a+1;
   for(let i=a;i<=b;i++)v[i]+=x.v/m;
  }
  const tot=v.reduce((q,y)=>q+y,0);if(!(tot>0))return null;
  let poc=0;v.forEach((q,i)=>{if(q>v[poc])poc=i});
  let l2=poc,h2=poc,acc=v[poc];
  while(acc<.7*tot&&(l2>0||h2<N-1)){
   const dn=l2>0?v[l2-1]:-1,upv=h2<N-1?v[h2+1]:-1;
   if(upv>=dn){h2++;acc+=v[h2]}else{l2--;acc+=v[l2]}
  }
  const avg=tot/N,mid=i=>lo+(i+.5)*bs,hvn=[];
  v.forEach((q,i)=>{if(q>=1.5*avg&&q>=(i?v[i-1]:0)&&q>=(i<N-1?v[i+1]:0))hvn.push(mid(i))});
  return{poc:mid(poc),vah:lo+(h2+1)*bs,val:lo+l2*bs,hvn,v,lo,bs,avg,N}
 }
 const VP=volProfile();
 // up=true (شورت روی سقف): سطح بالای VAH = گران‌تر از محدوده ارزش | up=false (لانگ روی کف): سطح زیر VAL
 function vpRow(up,lvl,org,risk){
  if(!VP)return null;
  const tolN=Math.max(1.5*VP.bs,.25*A),inR=lvl>=VP.lo&&lvl<=VP.lo+VP.N*VP.bs,
   bi=Math.max(0,Math.min(VP.N-1,Math.floor((lvl-VP.lo)/VP.bs))),ratio=inR?VP.v[bi]/VP.avg:0,
   node=[VP.poc,...VP.hvn].some(p=>Math.abs(p-lvl)<=tolN),
   prem=up?lvl>=VP.vah:lvl<=VP.val,
   toward=up?VP.poc<lvl&&VP.poc>org:VP.poc>lvl&&VP.poc<org;
  return{poc:VP.poc,vah:VP.vah,val:VP.val,prem,node,ratio,rrPoc:toward&&risk?Math.abs(VP.poc-lvl)/risk:null}
 }
 const RS=calcRSI(c),MC=calcMACD(c),rsiS=Number.isFinite(RS.ag[n-2])?{g:RS.ag[n-2],l:RS.al[n-2],pc:c[n-2].c}:null;
 // آخرین سقف/کف در حال شکل‌گیری (هنوز تأیید نشده؛ برای لحظه‌ی رسیدن قیمت به نقدینگی)
 function livePt(up){
  let b=null;
  for(let i=Math.max(L,n-L);i<n;i++){
   let ok=true;
   for(let k=1;k<=L;k++)if(up?c[i].h<c[i-k].h:c[i].l>c[i-k].l){ok=false;break}
   if(!ok)continue;
   const p=up?c[i].h:c[i].l;
   if(!b||(up?p>=b.p:p<=b.p))b={i,p,live:true};
  }
  return b}
 // up=true: واگرایی منفی روی سقف (قیمت سقف بالاتر/برابر، اسیلاتور پایین‌تر) | up=false: واگرایی مثبت روی کف
 function diverge(up,pts,zl,zh,osc,kind){
  let bi=-1;
  for(let j=pts.length-1;j>=0;j--)if(pts[j].p>=zl-tol&&pts[j].p<=zh+tol){bi=j;break}
  if(bi<0)return null;
  const B=pts[bi],ob=osc[B.i];let fb=null;
  if(!Number.isFinite(ob))return null;
  for(let j=bi-1,t=0;j>=0&&t<DIV.maxTry;j--){
   const a=pts[j],gap=B.i-a.i;
   if(gap>DIV.maxGap)break;if(gap<DIV.minGap)continue;
   const oa=osc[a.i];if(!Number.isFinite(oa)||(kind!=='r'&&a.i<35))continue;
   t++;
   if(up?B.p<a.p-tol:B.p>a.p+tol)continue;
   const mg=kind==='r'?1:.03*Math.max(Math.abs(oa),Math.abs(ob));
   if(!(up?ob<oa-mg:ob>oa+mg))continue;
   const z=kind==='r'&&(up?Math.max(oa,ob)>=DIV.ob:Math.min(oa,ob)<=DIV.os);
   const sl=kind==='r'?1:mg*.5;let bad=false;
   for(let k=a.i+1;k<B.i;k++){
    const ln=oa+(ob-oa)*(k-a.i)/gap;
    if(up?osc[k]>ln+sl:osc[k]<ln-sl){bad=true;break}

function wrap(x,t,w){const o=[];let l='';t.split(' ').forEach(wd=>{const n=l?l+' '+wd:wd;if(x.measureText(n).width>w&&l){o.push(l);l=wd}else l=n});if(l)o.push(l);return o}

function beep(){
 const Audio=window.AudioContext||window.webkitAudioContext;if(!S.sound||!Audio)return;ac=ac||new Audio();ac.resume().catch(()=>{});
 const g=ac.createGain();g.gain.value=S.vol/100;const cp=ac.createDynamicsCompressor();g.connect(cp);cp.connect(ac.destination);
 const T={siren:['square',[960,640]],beep:['sawtooth',[1100,1100]],bell:['sine',[1318,988]]}[S.tone];let t=ac.currentTime;
 for(let i=0;i<S.rep*2;i++){const o=ac.createOscillator();o.type=T[0];o.frequency.value=T[1][i%2];o.connect(g);o.start(t);o.stop(t+.26);t+=.3}}
function fire(r){beep();const m=`${r.sym.replace('USDT','')} ${r.tf} — نزدیک نقدینگی ${r.up?'سقف':'کف'} (${f(r.lvl)})${S.dRsi&&r.dR?' | واگرایی RSI':''}${S.dMacd&&r.dM?' | واگرایی MACD':''}${S.vp&&r.vp&&(r.vp.prem||r.vp.node)?' | والیوم پروفایل':''}`;
 document.title='🔔 '+m;setTimeout(()=>document.title='اسکنر نقدینگی',15000);
 try{if(Notification.permission==='granted')new Notification('آلارم نقدینگی',{body:m})}catch(e){}}

const syncUI=()=>{document.querySelectorAll('#tfs .chip').forEach(c=>c.classList.toggle('on',S.tfs.includes(c.dataset.t)));

['near','nearPct','minScore','vol','every'].forEach(k=>$('#'+k).oninput=e=>{S[k]=+e.target.value;save();syncUI();if(k==='every')setupTimer()});
['tone','rep','sort'].forEach(k=>$('#'+k).onchange=e=>{S[k]=k==='rep'?+e.target.value:e.target.value;save();tick(true)});
$('#sniper').onchange=e=>{S.sniper=e.target.checked;save();tick(true)};$('#snipN').onchange=e=>{S.snipN=+e.target.value||1;save();tick(true)};
$('#onlyNear').onchange=e=>{S.onlyNear=e.target.checked;save();tick(true)};
['dRsi','dMacd','rsiZone','vp'].forEach(k=>$('#'+k).onchange=e=>{S[k]=e.target.checked;save();tick(true)});

let pt;const setupTimer=()=>{clearInterval(pt);pt=setInterval(()=>started&&tick(),Math.max(2,S.every)*1000)};
const go2=()=>{if(!started)return;if(scanning){setTimeout(go2,100);return}stopReq=false;scan();setupTimer();tick()};

setInterval(()=>started&&!scanning&&scan(),3*60*1000);
syncUI();
